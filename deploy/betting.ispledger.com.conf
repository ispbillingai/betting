# Apache vhost for betting.ispledger.com
#   cp deploy/betting.ispledger.com.conf /etc/apache2/sites-available/betting.conf
#   a2ensite betting && a2enmod rewrite headers ssl
#   apache2ctl configtest && systemctl reload apache2
#
# TLS is the existing *.ispledger.com wildcard — no certbot run needed.

# Redirect HTTP to HTTPS
<VirtualHost *:80>
    ServerName betting.ispledger.com
    ServerAlias www.betting.ispledger.com
    Redirect permanent / https://betting.ispledger.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName betting.ispledger.com
    ServerAlias www.betting.ispledger.com
    DocumentRoot /var/www/html/betting

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/ispledger.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ispledger.com/privkey.pem

    <Directory /var/www/html/betting>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # The docroot IS the repo root, so application internals live inside the web
    # root. .htaccess blocks them, and these rules repeat it at vhost level so a
    # future AllowOverride change cannot expose the DB password in config/.
    <DirectoryMatch "^/var/www/html/betting/(config|src|views|lang|db|deploy|\.git)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/betting.ispledger.com-error.log
    CustomLog ${APACHE_LOG_DIR}/betting.ispledger.com-access.log combined
</VirtualHost>
