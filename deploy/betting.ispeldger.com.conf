# Apache vhost for betting.ispeldger.com
#   sudo cp deploy/betting.ispeldger.com.conf /etc/apache2/sites-available/
#   sudo a2ensite betting.ispeldger.com && sudo a2enmod rewrite headers
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then issue TLS (rewrites this file with the :443 block automatically):
#   sudo certbot --apache -d betting.ispeldger.com

<VirtualHost *:80>
    ServerName betting.ispeldger.com

    # Only /public is exposed. src/, config/, lang/, views/ and db/ sit above it
    # and are never reachable over HTTP.
    DocumentRoot /var/www/betting/public

    <Directory /var/www/betting/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Belt and braces: even if DocumentRoot is ever misconfigured, refuse the
    # directories that hold credentials and server-side code.
    <DirectoryMatch "^/var/www/betting/(src|config|lang|views|db|deploy)">
        Require all denied
    </DirectoryMatch>

    ErrorLog  ${APACHE_LOG_DIR}/betting_error.log
    CustomLog ${APACHE_LOG_DIR}/betting_access.log combined
</VirtualHost>
